name: Vatican Museums Ticket Monitor

on:
  schedule:
    # Every 10 minutes between 22:00-08:00 UTC (midnight-10am Rome time)
    # Vatican time is UTC+2 in summer. Tickets are released ~midnight Rome time.
    - cron: "*/10 22-23,0-7 * * *"
    # Also check hourly during daytime
    - cron: "0 8-21 * * *"
  workflow_dispatch:  # Manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python vatican_monitor.py \
            --once \
            --visitors 1,2,4 \
            --dates 30/05/2026,31/05/2026,01/06/2026 \
            --before 10:30
